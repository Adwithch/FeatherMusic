<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeatherMusic</title>
  
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700,800" rel="stylesheet" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <i data-lucide="feather" stroke-width="3" style="width: 28px; height: 28px; color: #a855f7;"></i>
        <span class="logo-text">FeatherMusic</span>
      </div>
      
      <div class="sidebar-label">Menu</div>
      <nav>
        <a href="#/" class="nav-item active" id="nav-home">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
        <a href="#/search" class="nav-item" id="nav-search">
          <i data-lucide="search"></i>
          <span>Search</span>
        </a>
        <a href="#/library" class="nav-item" id="nav-library">
          <i data-lucide="library"></i>
          <span>Your Library</span>
        </a>
      </nav>

      <div class="sidebar-label" style="margin-top: auto;">Support</div>
      <nav>
        <a href="#/about" class="nav-item" id="nav-about">
          <i data-lucide="info"></i>
          <span>About</span>
        </a>
        <a href="#/privacy" class="nav-item" id="nav-privacy">
          <i data-lucide="shield-check"></i>
          <span>Privacy</span>
        </a>
        <a href="#/legal" class="nav-item" id="nav-legal">
          <i data-lucide="file-text"></i>
          <span>Legal</span>
        </a>
      </nav>
    </aside>

    <div class="main-container">
      <header class="header">

        <div class="nav-controls">
          <div class="nav-btn" onclick="window.history.back()"><i data-lucide="chevron-left" style="width: 20px;"></i></div>
          <div class="nav-btn" onclick="window.history.forward()"><i data-lucide="chevron-right" style="width: 20px;"></i></div>
        </div>

        <div class="search-container">
          <i data-lucide="search" class="search-icon" style="width: 18px;"></i>
          <input type="text" id="global-search" class="search-pill" placeholder="What do you want to listen to?" />
        </div>

        <div class="header-right">
          <!-- Notification and Profile removed -->
        </div>
      </header>
      
      <main id="view" class="content-area"></main>
    </div>

    <footer class="player-bar">
      <div class="now-playing">
        <img id="np-art" class="np-art" src="icons/app.png" />
        <div class="np-info">
          <div id="np-title" class="np-title">Not Playing</div>
          <div id="np-artist" class="np-artist">Select a track</div>
        </div>
        <div class="np-actions" style="display: flex; align-items: center; gap: 4px; margin-left: 12px;">
          <button id="btn-favorite" class="icon-btn" title="Favorite" style="width: 32px; height: 32px;">
            <i data-lucide="heart" style="width: 18px;"></i>
          </button>
          <button id="btn-add-to-playlist" class="icon-btn" title="Add to Playlist" style="width: 32px; height: 32px;">
            <i data-lucide="plus" style="width: 18px;"></i>
          </button>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-btns">
          <i data-lucide="shuffle" id="btn-shuffle" class="icon-btn" style="width: 16px; color: var(--text-muted);"></i>
          <i data-lucide="skip-back" id="btn-prev" class="icon-btn" style="width: 20px;"></i>
          <div id="btn-play-pause" class="main-play-btn icon-btn">
            <i data-lucide="play" fill="currentColor" style="width: 18px; margin-left: 2px;"></i>
          </div>
          <i data-lucide="skip-forward" id="btn-next" class="icon-btn" style="width: 20px;"></i>
          <i data-lucide="repeat" id="btn-repeat" class="icon-btn" style="width: 16px; color: var(--text-muted);"></i>
        </div>
        
        <div class="progress-container">
          <span class="time-label" id="time-current">0:00</span>
          <div id="seek-bar" class="seek-bar">
            <div id="seek-fill" class="seek-fill" style="width: 0%;"></div>
          </div>
          <span class="time-label" id="time-total">0:00</span>
        </div>
      </div>

      <div class="volume-section">
        <i data-lucide="mic-2" id="btn-lyrics" class="icon-btn" style="width: 16px; color: var(--text-dim);"></i>
        <i data-lucide="list-music" id="btn-queue" class="icon-btn" style="width: 16px; color: var(--text-dim);"></i>
        <i data-lucide="volume-2" id="btn-volume" style="width: 18px; color: var(--text-dim);"></i>
        <div id="volume-bar" class="seek-bar" style="width: 100px; max-width: 100px;">
          <div id="volume-fill" class="seek-fill" style="width: 80%;"></div>
        </div>
        <i data-lucide="maximize-2" id="btn-fullscreen" class="icon-btn" style="width: 16px; color: var(--text-dim);"></i>
      </div>
    </footer>
  </div>

  <!-- Queue Overlay -->
  <div id="queue-overlay" class="side-overlay">
    <div class="overlay-header">
      <h3>Up Next</h3>
      <i data-lucide="x" class="close-overlay icon-btn"></i>
    </div>
    <div id="queue-content" class="queue-content"></div>
  </div>

  <!-- Fullscreen Player -->
  <div id="fullscreen-player" class="fullscreen-player">
    <div class="fs-background" id="fs-bg"></div>
    <div class="fs-vignette"></div>
    <button class="fs-close" id="btn-fs-close"><i data-lucide="chevron-down"></i></button>
    
    <div class="fs-content">
      <div class="fs-main">
        <div class="fs-art-container">
          <img id="fs-art" src="icons/app.png" class="fs-art" />
        </div>
        <div class="fs-info">
          <h1 id="fs-title">Not Playing</h1>
          <h2 id="fs-artist">Select a track</h2>
        </div>
        
        <div class="fs-controls">
          <div class="fs-progress-container">
            <div id="fs-seek-bar" class="seek-bar fs-seek-bar">
              <div id="fs-seek-fill" class="seek-fill"></div>
            </div>
            <div class="fs-time-labels">
              <span id="fs-time-current">0:00</span>
              <span id="fs-time-total">0:00</span>
            </div>
          </div>
          
          <div class="fs-btn-group">
            <button id="fs-btn-favorite" class="icon-btn fs-icon" title="Favorite" style="width: 48px; height: 48px;">
              <i data-lucide="heart" style="width: 24px; height: 24px;"></i>
            </button>
            <i data-lucide="shuffle" id="fs-btn-shuffle" class="icon-btn fs-icon"></i>
            <i data-lucide="skip-back" id="fs-btn-prev" class="icon-btn fs-icon"></i>
            <div id="fs-btn-play-pause" class="fs-play-btn"><i data-lucide="play" fill="currentColor"></i></div>
            <i data-lucide="skip-forward" id="fs-btn-next" class="icon-btn fs-icon"></i>
            <i data-lucide="repeat" id="fs-btn-repeat" class="icon-btn fs-icon"></i>
            <button id="fs-btn-add-to-playlist" class="icon-btn fs-icon" title="Add to Playlist" style="width: 48px; height: 48px;">
              <i data-lucide="plus" style="width: 24px; height: 24px;"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lyrics Fullscreen Popup -->
  <div id="lyrics-overlay" class="lyrics-fullscreen">
    <div class="lyrics-bg" id="lyrics-bg"></div>
    <div class="lyrics-header">
      <div class="lyrics-track-info">
        <img id="lyrics-art" src="icons/app.png" />
        <div>
          <div id="lyrics-title" style="font-weight: 800; font-size: 18px;">Song Title</div>
          <div id="lyrics-artist" style="font-size: 14px; color: rgba(255,255,255,0.6);">Artist Name</div>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="icon-btn" id="btn-lyrics-fullscreen" title="Fullscreen"><i data-lucide="maximize" style="width: 24px; height: 24px;"></i></button>
        <button class="icon-btn" id="btn-lyrics-close"><i data-lucide="x" style="width: 32px; height: 32px;"></i></button>
      </div>
    </div>
    <div id="lyrics-content" class="lyrics-container">
      <div class="lyrics-placeholder">Select a song to see lyrics</div>
    </div>
  </div>

  <!-- Audio Element (Hidden) -->
  <audio id="main-audio" style="display: none;"></audio>

  <div id="error-boundary" style="display:none; position:fixed; bottom:110px; right:20px; width:320px; padding:16px; background:#f44; color:#fff; z-index:9999; font-family:sans-serif; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.3s ease;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
      <strong style="font-size:14px;">Application Error</strong>
      <span id="close-error" style="cursor:pointer; font-size:18px; line-height:1;">&times;</span>
    </div>
    <div id="error-text" style="font-size:12px; opacity:0.9; white-space:pre-wrap; max-height:100px; overflow:hidden;"></div>
  </div>

  <style>
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>

  <script>
    window.onerror = (msg, url, line) => {
      const err = document.getElementById('error-boundary');
      const txt = document.getElementById('error-text');
      if (err && txt) {
        err.style.display = 'block';
        txt.textContent = `${msg}\nAt: ${url}:${line}`;
        
        const close = () => { err.style.display = 'none'; };
        document.getElementById('close-error').onclick = close;
        setTimeout(close, 5000);
      }
    };
  </script>

  <!-- Scripts -->
  <script src="js/neutralino.js"></script>
  
  <!-- Services & Utils -->
  <script src="js/services/api.js"></script>
  <script src="js/services/state.js"></script>
  <script src="js/services/playback.js"></script>
  <script src="js/utils/ui.js"></script>

  <!-- Pages -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/album.js"></script>
  <script src="js/pages/artist.js"></script>
  <script src="js/pages/playlist.js"></script>
  <script src="js/pages/library.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="js/pages/privacy.js"></script>
  <script src="js/pages/legal.js"></script>

  <!-- Core App -->
  <script src="js/app.js"></script>
</body>
</html>
